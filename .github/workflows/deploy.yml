name: Deploy to GCS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          # Store your Service Account JSON key in GitHub Secrets as GCP_CREDENTIALS
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Upload to Cloud Storage
        id: 'upload-file'
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: '.'
          # Store your bucket name in GitHub Secrets as GCP_BUCKET_NAME
          destination: '${{ secrets.GCP_BUCKET_NAME }}'
          parent: false
          # Upload only relevant files, excluding hidden files and the .github folder
          glob: '**'
          # Exclude these patterns
          excludes: |-
            .git/
            .github/
            .gitignore
            README.md
          headers: |-
            cache-control: public, max-age=3600
